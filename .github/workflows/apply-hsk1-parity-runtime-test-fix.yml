name: Apply HSK1 parity runtime test fix
on:
  push:
    branches:
      - agent/hsk1-parity-official-vocab
    paths:
      - new-hsk1/hsk1/apply-parity-runtime-test-fix.cjs
      - .github/workflows/apply-hsk1-parity-runtime-test-fix.yml
  pull_request:
    branches:
      - gh-pages
    paths:
      - new-hsk1/hsk1/apply-parity-runtime-test-fix.cjs
      - .github/workflows/apply-hsk1-parity-runtime-test-fix.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hsk1-parity-official-vocab
      - name: Patch JSDOM classic-script model
        run: node new-hsk1/hsk1/apply-parity-runtime-test-fix.cjs
      - name: Commit runtime test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-hsk1/hsk1/audio-architecture-runtime.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Model parity scripts correctly in HSK1 audio runtime test"
          git push origin HEAD:agent/hsk1-parity-official-vocab
