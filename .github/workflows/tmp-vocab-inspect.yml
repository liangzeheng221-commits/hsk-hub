name: Final HSK1 HSK2 textbook corrections
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/tmp-vocab-inspect.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply source-verified corrections
        run: python tools/final-hsk12-patch.py
      - name: Run QA before commit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          node tools/site-qa.mjs
          node tools/hsk12-content-audit.mjs
      - name: Commit corrections and remove temporary files
        run: |
          git config user.name "nhiennhientran"
          git config user.email "liangzeheng221@gmail.com"
          git rm .github/workflows/tmp-vocab-inspect.yml tools/final-hsk12-patch.py
          git add hsk1/content-audit.js assets/hsk2-content-audit.js assets/hanzi-curriculum.js assets/hsk12-audit.css tools/hsk12-content-audit.mjs
          git commit -m "Finish HSK1 and HSK2 textbook audit corrections"
          git push origin HEAD:gh-pages
