name: Grammar audit migration 20260815
on:
  push:
    branches: ['fix/236-grammar-audit-20260815']
    paths:
      - 'tools/apply-grammar-236-fixes.mjs'
      - 'curriculum/grammar-manifest.json'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/236-grammar-audit-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check migration
        run: node --check tools/apply-grammar-236-fixes.mjs
      - name: Apply deterministic migration
        run: node tools/apply-grammar-236-fixes.mjs
      - name: Validate generated JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in hsk1/data-{1..5}.js hsk4up/data/{01..10}.js hsk4/data/{11..20}.js hsk4up/textbook-detail-ui.js; do
            node --check "$f"
          done
          git diff --check
      - name: Commit migrated curriculum data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No migration changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hsk1/data-*.js hsk1/index.html hsk1/lesson.html hsk4up/data/*.js hsk4up/index.html hsk4up/lesson.html hsk4/data/*.js hsk4/index.html hsk4/lesson.html
          git commit -m 'Apply 236-point grammar audit corrections to canonical data'
          git push origin HEAD:fix/236-grammar-audit-20260815
