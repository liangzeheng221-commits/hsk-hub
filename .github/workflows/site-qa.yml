name: HSK Site QA
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install DOM test dependency
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
      - name: Run hotfix runtime regression checks
        run: node qa/hotfix-runtime.mjs
      - name: Run session auth and HSK1 Hanzi regression checks
        run: node qa/session-hanzi-hotfix.mjs
      - name: Run course and link QA
        run: node tools/site-qa.mjs
      - name: Run HSK1 and HSK2 content audit
        run: node tools/hsk12-content-audit.mjs
      - name: Validate reviewed HSK3 and HSK4 practice banks
        run: node qa/reviewed-practice-smoke.mjs
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk-site-qa-report
          path: qa/*.json
          if-no-files-found: warn
