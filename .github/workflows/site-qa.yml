name: HSK Site QA
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
      - name: Run course and link QA
        run: node tools/site-qa.mjs
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk-site-qa-report
          path: qa/site-qa-report.json
          if-no-files-found: warn
