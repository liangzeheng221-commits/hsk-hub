name: Apply HSK1 parity official vocab fix
on:
  push:
    branches:
      - agent/hsk1-parity-official-vocab
    paths:
      - new-hsk1/hsk1/apply-parity-official-vocab-fix.cjs
      - .github/workflows/apply-hsk1-parity-official-vocab.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hsk1-parity-official-vocab
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply deterministic source patch
        run: node new-hsk1/hsk1/apply-parity-official-vocab-fix.cjs
      - name: Commit patched production sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-hsk1/assets/hsk2-parity.js new-hsk1/hsk1/textbook-segment-audio.js new-hsk1/hsk1/audio-architecture-runtime.cjs new-hsk1/hsk1/audio-architecture-check.cjs new-hsk1/hsk1/lesson.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Route HSK1 parity vocabulary to textbook audio"
          git push origin HEAD:agent/hsk1-parity-official-vocab
