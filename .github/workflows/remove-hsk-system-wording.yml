name: Remove HSK system wording
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/remove-hsk-system-wording.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove cross-system wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hsk4/content-final.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("L.textbookSystem='HSK Standard Course 4B · original six-level HSK / HSK 2.0 syllabus';", "L.textbookSystem='HSK Standard Course 4B · 《HSK标准教程4（下）》教材口径';")
          s=s.replace("syllabusContext:'original six-level HSK / HSK 2.0 textbook system',", "syllabusContext:'《HSK标准教程4（下）》教材口径',")
          if 'HSK 2.0' in s or 'HSK 3.0' in s:
              raise SystemExit('cross-system wording still present in hsk4/content-final.js')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "nhiennhientran"
          git config user.email "liangzeheng221@gmail.com"
          git add hsk4/content-final.js
          git commit -m "Remove HSK system comparison from HSK4 metadata"
          git push origin HEAD:gh-pages
