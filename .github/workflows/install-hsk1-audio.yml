name: Install New HSK1 textbook audio

on:
  push:
    branches:
      - gh-pages
    paths:
      - HSK1_textbook_audio_integration_ready.zip

permissions:
  contents: write

concurrency:
  group: hsk1-textbook-audio-install
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Validate and install 93 audio tracks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import json
          import shutil

          archive = Path('HSK1_textbook_audio_integration_ready.zip')
          if not archive.exists():
              raise SystemExit('Upload ZIP not found at repository root')

          target = Path('new-hsk1/hsk1/audio')
          manifest_target = Path('new-hsk1/hsk1/textbook-audio-manifest.json')
          temp = Path('_hsk1_audio_install')
          if temp.exists():
              shutil.rmtree(temp)
          temp.mkdir()

          with ZipFile(archive) as z:
              manifest = json.loads(z.read('textbook-audio-manifest.json'))
              entries = manifest.get('entries', [])
              if manifest.get('count') != 93 or len(entries) != 93:
                  raise SystemExit(f'Expected 93 manifest entries, got {len(entries)}')

              expected = {
                  f'{lesson}-{track}.mp3'
                  for lesson in range(1, 16)
                  for track in range(1, 8 if lesson <= 3 else 7)
              }
              actual = {Path(entry['file']).name for entry in entries}
              if actual != expected:
                  missing = sorted(expected - actual)
                  extra = sorted(actual - expected)
                  raise SystemExit(f'Audio filename mismatch. Missing={missing}, extra={extra}')

              if target.exists():
                  shutil.rmtree(target)
              target.mkdir(parents=True)

              for entry in entries:
                  archive_name = entry['file']
                  data = z.read(archive_name)
                  if len(data) != int(entry['bytes']):
                      raise SystemExit(f'Size mismatch: {archive_name}')
                  digest = hashlib.sha256(data).hexdigest()
                  if digest != entry['sha256']:
                      raise SystemExit(f'SHA256 mismatch: {archive_name}')
                  (target / Path(archive_name).name).write_bytes(data)

              manifest_target.write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8'
              )

          installed = sorted(target.glob('*.mp3'))
          if len(installed) != 93:
              raise SystemExit(f'Installed {len(installed)} MP3 files, expected 93')

          total = sum(p.stat().st_size for p in installed)
          print(f'Validated and installed {len(installed)} tracks ({total} bytes)')
          PY

      - name: Commit installed audio and remove upload ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-hsk1/hsk1/audio new-hsk1/hsk1/textbook-audio-manifest.json
          git rm -f HSK1_textbook_audio_integration_ready.zip
          git commit -m "Install New HSK1 textbook audio"
          git push origin HEAD:gh-pages
