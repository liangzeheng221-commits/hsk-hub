name: HSK4 Upper Locked Textbook QA

on:
  push:
    branches: [gh-pages]
    paths:
      - 'hsk4up/**'
      - 'tools/hsk4u-textbook-locked-audit.mjs'
      - '.github/workflows/hsk4-upper-locked.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-textbook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check hsk4up/textbook-locked.js
          node --check hsk4up/textbook-locked-guard.js
          node --check hsk4up/textbook-locked-ui.js
          node --check tools/hsk4u-textbook-locked-audit.mjs
          for f in hsk4up/textbook-locked-data-*.js; do node --check "$f"; done
      - name: Validate authoritative locked corpus
        run: node tools/hsk4u-textbook-locked-audit.mjs
      - name: Live browser check all 50 textbook units
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          BASE='https://nhiennhientran.github.io/hsk-hub/hsk4up'
          OK=0
          for attempt in $(seq 1 24); do
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=14000 --dump-dom "$BASE/index.html?lockedqa=$GITHUB_SHA-$attempt" > /tmp/hsk4u-home.html 2>/tmp/hsk4u-home.err || true
            if grep -q 'data-hsk4-upper="ready"' /tmp/hsk4u-home.html && grep -q 'data-hsk4-upper-textbook-locked="ok"' /tmp/hsk4u-home.html; then OK=1; break; fi
            sleep 10
          done
          test "$OK" = 1
          grep -Eq 'id="wordStat">324<' /tmp/hsk4u-home.html
          echo 'LIVE HSK4 UPPER HOME PASS'
          for lesson in $(seq 1 10); do
            for text in $(seq 1 5); do
              FILE="/tmp/hsk4u-${lesson}-${text}.html"
              "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=14000 --dump-dom "$BASE/lesson.html?id=$lesson&sec=text&text=$text&lockedqa=$GITHUB_SHA" > "$FILE" 2>/tmp/hsk4u-lesson.err || true
              grep -q 'data-hsk4-upper="ready"' "$FILE"
              grep -q 'data-hsk4-upper-textbook-locked="ok"' "$FILE"
              grep -q 'data-hsk4-upper-textbook-ui="ok"' "$FILE"
              grep -q "class=\"text-card textbook-locked-card\" data-text-no=\"$text\"" "$FILE"
              test "$(grep -o 'class="textbook-locked-line"' "$FILE" | wc -l | tr -d ' ')" -ge 1
              grep -q 'class="line-zh zh"' "$FILE"
              grep -q 'class="line-py"' "$FILE"
              grep -q 'class="line-vn"' "$FILE"
              ! grep -q 'BÀI KHOÁ — 课文重点' "$FILE"
              ! grep -q 'Đọc tóm tắt, nghe câu trọng điểm' "$FILE"
              echo "LIVE HSK4 UPPER L${lesson} T${text} PASS"
            done
          done
          echo 'HSK4 UPPER LIVE BROWSER PASS: 10 lessons · 50 full textbook units · locked Chinese/pinyin/Vietnamese renderer'
