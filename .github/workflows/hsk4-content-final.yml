name: HSK4 Lower Final Content QA

on:
  push:
    branches: [gh-pages]
    paths:
      - 'hsk4/**'
      - 'qa/hsk4-content-final.mjs'
      - '.github/workflows/hsk4-content-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Syntax checks
        run: |
          node --check hsk4/content-final.js
          node --check hsk4/content-ui-final.js
          node --check hsk4/practice-final.js
          node --check qa/hsk4-content-final.mjs
      - name: Deep textbook/content regression QA
        run: node qa/hsk4-content-final.mjs
      - name: Live GitHub Pages final-content check
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          BASE='https://nhiennhientran.github.io/hsk-hub/hsk4'
          OK=0
          for attempt in 1 2 3 4 5 6 7 8; do
            FILE="/tmp/hsk4-final.html"
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --dump-dom "$BASE/lesson.html?id=11&sec=vocab&finalqa=$GITHUB_SHA-$attempt" > "$FILE" 2>/tmp/hsk4-final.err || true
            pos=$( (grep -o 'class="pos-badge"' "$FILE" || true) | wc -l | tr -d ' ')
            if grep -q 'data-hsk4-content-final="20260814-5"' "$FILE" && [ "$pos" -ge 30 ] && grep -q 'id="vocabCoverage">30/30' "$FILE"; then OK=1; break; fi
            echo "Public final content not ready yet (attempt=$attempt, pos=$pos)"
            sleep 10
          done
          test "$OK" = "1"
          grep -q 'hào' "$FILE"
          grep -q 'proper-noun-item' "$FILE"
          grep -q 'textbook-task-group' "$FILE"
          grep -q '书内第 2 页' "$FILE"

          FILE16=/tmp/hsk4-final-16.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=9000 --dump-dom "$BASE/lesson.html?id=16&sec=vocab&finalqa=$GITHUB_SHA" > "$FILE16" 2>/tmp/hsk4-final16.err || true
          grep -q 'id="lessonTitle" class="zh">生活可以更美好<' "$FILE16"
          ! grep -q 'id="lessonTitle" class="zh">生活可以更美好。<' "$FILE16"

          curl -fsSL "$BASE/content-final.js?v=20260814f&finalqa=$GITHUB_SHA" > /tmp/content-final-live.js
          grep -q '海底的动物们一直在“说话”' /tmp/content-final-live.js
          grep -q '各种颜色的亮光' /tmp/content-final-live.js
          grep -q '上海话本身和普通话差别很大' /tmp/content-final-live.js
          grep -q '活动倡议关灯一小时' /tmp/content-final-live.js
          grep -q '教材未提供调查机构、样本和年份' /tmp/content-final-live.js
          echo 'LIVE HSK4 FINAL CONTENT PASS: title + POS + pages + full practice coverage + context boundaries + critical textbook corrections'
