name: Check HSK1 official audio release
on:
  push:
    branches:
      - agent/hsk1-official-audio-release
      - agent/hsk1-audio-step8
      - gh-pages
    paths:
      - 'new-hsk1/hsk1/**'
      - '.github/workflows/hsk1-official-audio-release-check.yml'
  pull_request:
    branches:
      - gh-pages
    paths:
      - 'new-hsk1/hsk1/**'
      - '.github/workflows/hsk1-official-audio-release-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check new-hsk1/hsk1/textbook-data-corrections.js
          node --check new-hsk1/hsk1/textbook-segment-audio.js
          node --check new-hsk1/hsk1/textbook-audio-guard.js
          node --check new-hsk1/hsk1/official-audio-step8-check.cjs
      - name: Verify Step 8 textbook audio data and files
        working-directory: new-hsk1/hsk1
        run: node official-audio-step8-check.cjs
