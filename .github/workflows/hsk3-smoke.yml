name: HSK3 Smoke Test

on:
  push:
    branches: [gh-pages]
    paths:
      - 'hsk3/**'
      - 'practice/reviewed/hsk3-v1.1*'
      - 'assets/hsk2-parity.js'
      - 'assets/lesson-menu-parity.js'
      - 'assets/hanzi-curriculum.js'
      - 'qa/hsk3-smoke.mjs'
      - 'qa/hsk3-content-audit.mjs'
      - 'qa/find-valid-hsk3-data.mjs'
      - '.github/workflows/hsk3-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find valid HSK3 data versions in history
        run: node qa/find-valid-hsk3-data.mjs
      - name: Install DOM test dependency
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Syntax checks
        run: |
          node --check hsk3/runtime-loader.js
          node --check hsk3/app-core.js
          node --check hsk3/app-practice.js
          node --check hsk3/corrections.js
          node --check hsk3/textbook-baseline.js
          node --check hsk3/textbook-audit.js
          node --check hsk3/textbook-audit-ui.js
          node --check assets/hsk2-parity.js
          node --check assets/lesson-menu-parity.js
          node --check assets/hanzi-curriculum.js
          node --check qa/hsk3-content-audit.mjs
      - name: Verify HSK3 textbook content audit
        run: node qa/hsk3-content-audit.mjs
      - name: Decode current data and render all HSK3 lessons
        run: node qa/hsk3-smoke.mjs
      - name: Live browser check against public GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          BASE='https://nhiennhientran.github.io/hsk-hub/hsk3'
          OK=0
          for attempt in 1 2 3 4 5 6; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom "$BASE/index.html?liveqa=$GITHUB_SHA-$attempt" > /tmp/hsk3-home.html 2>/tmp/chrome-home.err || true
            CARDS=$(grep -o 'lesson-card' /tmp/hsk3-home.html | wc -l | tr -d ' ')
            if [ "$CARDS" -ge "20" ] && grep -q 'data-hsk3-runtime="ok"' /tmp/hsk3-home.html && grep -q 'id="hsk3TextbookNote"' /tmp/hsk3-home.html; then OK=1; break; fi
            echo "Public page not ready yet (attempt $attempt, lesson-card tokens=$CARDS); waiting..."
            tail -20 /tmp/chrome-home.err || true
            sleep 10
          done
          test "$OK" = "1"
          grep -Eq 'id="wordStat">325<' /tmp/hsk3-home.html
          grep -q '300' /tmp/hsk3-home.html
          echo "LIVE HOME PASS: public GitHub Pages runtime=ok, 20 lesson cards, 325 textbook items and audited system note rendered"
          for i in $(seq 1 20); do
            FILE="/tmp/hsk3-lesson-$i.html"
            ERR="/tmp/chrome-$i.err"
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom "$BASE/lesson.html?id=$i&sec=practice&liveqa=$GITHUB_SHA" > "$FILE" 2>"$ERR" || true
            runtime=$(grep -c 'data-hsk3-runtime="ok"' "$FILE" || true)
            title=$(grep -Ec 'id="lessonTitle"[^>]*>[^<]+' "$FILE" || true)
            vocab=$(grep -c 'class="vcard"' "$FILE" || true)
            scenes=$(grep -c 'scene-tab' "$FILE" || true)
            grammar=$(grep -c 'grammar-card' "$FILE" || true)
            hanzi=$(grep -c 'hanzi-chip' "$FILE" || true)
            totalPractice=$( (grep -o 'class="qcard reviewed-card' "$FILE" || true) | wc -l | tr -d ' ' )
            advanced=$( (grep -o 'class="qcard reviewed-card advanced-card' "$FILE" || true) | wc -l | tr -d ' ' )
            basic=$((totalPractice-advanced))
            menu=$(grep -c 'parity-lesson-menu-wrap' "$FILE" || true)
            textbookHanzi=$(grep -c 'id="textbookHanziFocus"' "$FILE" || true)
            auditVocab=$(grep -c 'id="auditVocabSummary"' "$FILE" || true)
            auditText=$(grep -c 'id="auditTextbookSource"' "$FILE" || true)
            auditGrammar=$(grep -c 'id="auditGrammarNote"' "$FILE" || true)
            practiceNote=$(grep -c 'class="practice-note"' "$FILE" || true)
            leaked=$(grep -Ec '依据官方练习册|练习册第|改编为|source_mode|source_page|source_id|source_basis|怎么做网站|如何做网站' "$FILE" || true)
            echo "LIVE LESSON $i CHECK: runtime=$runtime title=$title vocab=$vocab scenes=$scenes grammar=$grammar hanzi=$hanzi basic=$basic advanced=$advanced menu=$menu textbookHanzi=$textbookHanzi auditVocab=$auditVocab auditText=$auditText auditGrammar=$auditGrammar practiceNote=$practiceNote leaked=$leaked"
            if [ "$runtime" -lt 1 ] || [ "$title" -lt 1 ] || [ "$vocab" -lt 1 ] || [ "$scenes" -lt 1 ] || [ "$grammar" -lt 1 ] || [ "$hanzi" -lt 1 ] || [ "$basic" -ne 18 ] || [ "$advanced" -ne 14 ] || [ "$menu" -lt 1 ] || [ "$textbookHanzi" -lt 1 ] || [ "$auditVocab" -lt 1 ] || [ "$auditText" -lt 1 ] || [ "$auditGrammar" -lt 1 ] || [ "$practiceNote" -lt 1 ] || [ "$leaked" -ne 0 ]; then
              echo "LIVE LESSON $i FAILURE"
              grep -o 'data-hsk3-runtime="[^"]*"' "$FILE" | head || true
              grep -o 'HSK 3 tải dữ liệu thất bại[^<]*' "$FILE" | head || true
              tail -30 "$ERR" || true
              exit 1
            fi
            echo "LIVE LESSON $i PASS"
          done
          echo 'HSK3 LIVE BROWSER TEST PASS: public home + all 20 lesson pages + 18 basic + 14 advanced reviewed questions per lesson'
