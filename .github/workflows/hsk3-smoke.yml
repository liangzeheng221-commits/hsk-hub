name: HSK3 Smoke Test

on:
  push:
    branches: [gh-pages]
    paths:
      - 'hsk3/**'
      - 'assets/hsk2-parity.js'
      - 'assets/lesson-menu-parity.js'
      - 'assets/hanzi-curriculum.js'
      - 'qa/hsk3-smoke.mjs'
      - 'qa/find-valid-hsk3-data.mjs'
      - '.github/workflows/hsk3-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find valid HSK3 data versions in history
        run: node qa/find-valid-hsk3-data.mjs
      - name: Install DOM test dependency
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Syntax checks
        run: |
          node --check hsk3/runtime-loader.js
          node --check hsk3/app-core.js
          node --check hsk3/app-practice.js
          node --check hsk3/corrections.js
          node --check hsk3/textbook-baseline.js
          node --check assets/hsk2-parity.js
          node --check assets/lesson-menu-parity.js
          node --check assets/hanzi-curriculum.js
      - name: Decode current data and render all HSK3 lessons
        run: node qa/hsk3-smoke.mjs
      - name: Live browser check against public GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          BASE='https://nhiennhientran.github.io/hsk-hub/hsk3'
          OK=0
          for attempt in 1 2 3 4 5 6; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom "$BASE/index.html?liveqa=$GITHUB_SHA-$attempt" > /tmp/hsk3-home.html 2>/tmp/chrome-home.err || true
            CARDS=$(grep -o 'class="lesson-card"' /tmp/hsk3-home.html | wc -l | tr -d ' ')
            if [ "$CARDS" = "20" ] && grep -q 'data-hsk3-runtime="ok"' /tmp/hsk3-home.html; then OK=1; break; fi
            echo "Public page not ready yet (attempt $attempt, cards=$CARDS); waiting..."
            sleep 10
          done
          test "$OK" = "1"
          grep -Eq '<b id="wordStat">[0-9]+</b>' /tmp/hsk3-home.html
          echo "LIVE HOME PASS: 20 lesson cards rendered on public GitHub Pages"
          for i in $(seq 1 20); do
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom "$BASE/lesson.html?id=$i&sec=vocab&liveqa=$GITHUB_SHA" > "/tmp/hsk3-lesson-$i.html" 2>"/tmp/chrome-$i.err"
            grep -q 'data-hsk3-runtime="ok"' "/tmp/hsk3-lesson-$i.html"
            grep -Eq '<h1 class="zh" id="lessonTitle">[^<]+' "/tmp/hsk3-lesson-$i.html"
            grep -q 'class="vocab-card"' "/tmp/hsk3-lesson-$i.html"
            grep -q 'class="grammar-card"' "/tmp/hsk3-lesson-$i.html"
            grep -q 'id="basicPractice"' "/tmp/hsk3-lesson-$i.html"
            grep -q 'id="advancedPractice"' "/tmp/hsk3-lesson-$i.html"
            grep -q 'parity-lesson-menu-wrap' "/tmp/hsk3-lesson-$i.html"
            grep -q 'id="textbookHanziFocus"' "/tmp/hsk3-lesson-$i.html"
            echo "LIVE LESSON $i PASS"
          done
          echo 'HSK3 LIVE BROWSER TEST PASS: public home + all 20 lesson pages'
