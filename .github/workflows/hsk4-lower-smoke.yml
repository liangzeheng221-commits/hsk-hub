name: HSK4 Lower Smoke Test

on:
  push:
    branches: [gh-pages]
    paths:
      - 'hsk4/**'
      - 'index.html'
      - 'qa/hsk4-lower-smoke.mjs'
      - '.github/workflows/hsk4-lower-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Syntax checks
        run: |
          node --check hsk4/data.js
          for f in hsk4/data/*.js; do node --check "$f"; done
          node --check hsk4/runtime.js
          node --check hsk4/content-audit.js
          node --check hsk4/modules.js
          node --check hsk4/hanzi-parity.js
          node --check hsk4/practice.js
          node --check qa/hsk4-lower-smoke.mjs
      - name: Render and validate HSK4 Lower
        run: node qa/hsk4-lower-smoke.mjs
      - name: Live Chrome check on public GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          BASE='https://nhiennhientran.github.io/hsk-hub/hsk4'
          OK=0
          for attempt in 1 2 3 4 5 6 7 8; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=8000 --dump-dom "$BASE/index.html?liveqa=$GITHUB_SHA-$attempt" > /tmp/hsk4-home.html 2>/tmp/chrome-home.err || true
            cards=$( (grep -o 'class="lesson-card"' /tmp/hsk4-home.html || true) | wc -l | tr -d ' ')
            if [ "$cards" -ge 10 ] && grep -q 'data-hsk4-runtime="ok"' /tmp/hsk4-home.html; then OK=1; break; fi
            echo "Public HSK4 下 not ready yet (attempt $attempt, cards=$cards)"
            sleep 10
          done
          test "$OK" = "1"
          grep -Eq 'id="wordStat">[0-9]+' /tmp/hsk4-home.html
          ROOT='/tmp/hsk-root.html'
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom 'https://nhiennhientran.github.io/hsk-hub/index.html?liveqa='"$GITHUB_SHA" > "$ROOT" 2>/tmp/chrome-root.err || true
          grep -q 'hsk4/index.html' "$ROOT"
          echo 'LIVE HOME + ROOT PORTAL PASS'
          for i in $(seq 11 20); do
            FILE="/tmp/hsk4-$i.html"
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=9000 --dump-dom "$BASE/lesson.html?id=$i&sec=vocab&liveqa=$GITHUB_SHA" > "$FILE" 2>"/tmp/chrome-$i.err" || true
            runtime=$( (grep -o 'data-hsk4-runtime="ok"' "$FILE" || true) | wc -l | tr -d ' ')
            title=$( (grep -Eo 'id="lessonTitle"[^>]*>[^<]+' "$FILE" || true) | wc -l | tr -d ' ')
            vocab=$( (grep -o 'class="vcard"' "$FILE" || true) | wc -l | tr -d ' ')
            texts=$( (grep -o 'scene-tab' "$FILE" || true) | wc -l | tr -d ' ')
            grammar=$( (grep -o 'grammar-card' "$FILE" || true) | wc -l | tr -d ' ')
            compare=$( (grep -o '比一比' "$FILE" || true) | wc -l | tr -d ' ')
            culture=$( (grep -o '文化' "$FILE" || true) | wc -l | tr -d ' ')
            hanzi=$( (grep -o 'hanzi-char-btn' "$FILE" || true) | wc -l | tr -d ' ')
            stroke_ui=$( (grep -o '逐笔写法 · Từng bước viết' "$FILE" || true) | wc -l | tr -d ' ')
            basic=$( (grep -o 'reviewed-card' "$FILE" || true) | wc -l | tr -d ' ')
            advanced=$( (grep -o 'advanced-card' "$FILE" || true) | wc -l | tr -d ' ')
            echo "LIVE LESSON $i: runtime=$runtime title=$title vocab=$vocab texts=$texts grammar=$grammar compare=$compare culture=$culture hanzi=$hanzi stroke_ui=$stroke_ui basic=$basic advanced=$advanced"
            if [ "$runtime" -lt 1 ] || [ "$title" -lt 1 ] || [ "$vocab" -lt 1 ] || [ "$texts" -lt 5 ] || [ "$grammar" -lt 5 ] || [ "$compare" -lt 1 ] || [ "$culture" -lt 1 ] || [ "$hanzi" -lt 1 ] || [ "$stroke_ui" -lt 1 ] || [ "$basic" -lt 36 ] || [ "$advanced" -lt 16 ]; then
              echo "LIVE LESSON $i FAILURE"
              grep -o 'data-hsk4-runtime="[^"]*"' "$FILE" | head || true
              tail -30 "/tmp/chrome-$i.err" || true
              exit 1
            fi
            echo "LIVE LESSON $i PASS"
          done
          HANZI_OK=0
          for attempt in 1 2 3 4; do
            HANZI_FILE="/tmp/hsk4-hanzi-11-$attempt.html"
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom "$BASE/lesson.html?id=11&sec=hanzi&liveqa=$GITHUB_SHA-hanzi-$attempt" > "$HANZI_FILE" 2>"/tmp/chrome-hanzi.err" || true
            steps=$( (grep -o 'class="stroke-step"' "$HANZI_FILE" || true) | wc -l | tr -d ' ')
            if [ "$steps" -ge 1 ] && grep -q '第 1 笔' "$HANZI_FILE"; then HANZI_OK=1; break; fi
            echo "HSK4 stroke data not ready yet (attempt $attempt, steps=$steps)"
            sleep 8
          done
          test "$HANZI_OK" = "1"
          grep -q '演示笔顺 · Xem bút thuận' "$HANZI_FILE"
          grep -q '练习书写 · Luyện viết' "$HANZI_FILE"
          grep -q '重置 · Đặt lại' "$HANZI_FILE"
          grep -Eq '[0-9]+ 画 · [0-9]+ nét' "$HANZI_FILE"
          echo 'LIVE HSK4 HANZI PARITY PASS: writer + cumulative stroke cards + bilingual controls'
          # The lesson page renders only the active text scene into the DOM. Verify factual
          # regressions against the actual public data assets rather than incorrectly grepping
          # hidden/non-rendered scenes from dump-dom.
          curl -fsSL "$BASE/data/19.js?v=20260814d&liveqa=$GITHUB_SHA" > /tmp/live-19.js
          curl -fsSL "$BASE/data/20.js?v=20260814d&liveqa=$GITHUB_SHA" > /tmp/live-20.js
          curl -fsSL "$BASE/content-audit.js?v=20260814d&liveqa=$GITHUB_SHA" > /tmp/live-audit.js
          grep -q '运动员发球时' /tmp/live-19.js
          grep -q '记错了一个电话号码数字' /tmp/live-19.js
          grep -q '不是少数民族' /tmp/live-20.js
          grep -q '广西冬天也比较暖和' /tmp/live-20.js
          grep -q '咸辣、香辣、酸辣' /tmp/live-audit.js
          echo 'LIVE FACTUAL ASSET REGRESSION PASS'
          echo 'HSK4 LOWER LIVE BROWSER TEST PASS: public home + lessons 11–20 + Hanzi parity + audited factual regressions'
